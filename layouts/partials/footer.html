<footer class="mt-auto py-8 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-center text-[10px] md:text-xs text-slate-400 dark:text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-center items-center gap-2 md:gap-4">
        <span>&copy; 2026 <a href="https://tamadalab.github.io/" class="text-ksu dark:text-blue-400 hover:underline" target="_blank">Tamada Lab.</a></span>
        <span class="hidden md:inline text-slate-200 dark:text-slate-700">|</span>
        <a href="https://github.com/tamadalab/welfare-time" class="font-bold text-ksu dark:text-blue-400 hover:underline" target="_blank">
            <i class="bi bi-github"></i> GitHub
        </a>
        {{/* バージョンは package.json を唯一の定義とする。最終更新日時はビルド時に Justfile が渡す */}}
        {{- $version := (os.ReadFile "package.json" | transform.Unmarshal).version }}
        <span class="hidden md:inline text-slate-200 dark:text-slate-700">|</span>
        <span>
            <a href="{{ "help/changelog/" | relURL }}" class="text-ksu dark:text-blue-400 hover:underline" title="変更履歴">v{{ $version }}</a>
            {{- with site.Params.codeupdated }}（コード最終更新：{{ . }}）{{ end }}
        </span>
    </div>
</footer>
